[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express", "@netlify/blobs", "serverless-http", "@netlify/aws-lambda-compat"]
  node_bundler = "esbuild"
  included_files = ["server/data/nxl.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
